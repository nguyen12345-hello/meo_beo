name: Build Flutter iOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Validate and Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Flutter 3.50 matches the SDK constraints in pubspec.lock and supports
      # the iOS Swift package integration used by this project.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Validate iOS project files
        run: |
          plutil -lint ios/Runner.xcodeproj/project.pbxproj
          plutil -lint ios/Runner/Info.plist
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' ios/Runner.xcodeproj/project.pbxproj ios/Runner/Info.plist lib/local_network_permission.dart; then
            echo "Unresolved Git conflict markers found in iOS project files."
            exit 1
          fi

      - name: Install Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Inspect Xcode project
        run: xcodebuild -list -project ios/Runner.xcodeproj

      - name: Build iOS archive
        run: flutter build ipa --release --no-codesign

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          test -d "$APP_PATH"
          rm -rf Payload meo-beo-ios-release-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          /usr/bin/zip -qry meo-beo-ios-release-unsigned.ipa Payload
          rm -rf Payload
          /usr/bin/unzip -t meo-beo-ios-release-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meo-beo-ios-release-unsigned
          path: meo-beo-ios-release-unsigned.ipa
          if-no-files-found: error
