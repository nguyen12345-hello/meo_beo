name: Build Flutter iOS IPA

on:
  push:
    branches: [ "main" ]

jobs:
  build-ios:
    name: Build iOS App and Export Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          mkdir -p Payload
          cd Payload
          ln -s ../build/ios/iphoneos/Runner.app Runner.app
          cd ..
          zip -r flutter-app.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-ipa
          path: flutter-app.ipa